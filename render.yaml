services:
  - type: web
    name: fitplanner-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    rootDir: api
    plan: free
    envVars:
      - key: FITPLANNER_DB_HOST
        sync: false
      - key: FITPLANNER_DB_PORT
        value: "3306"
      - key: FITPLANNER_DB_NAME
        sync: false
      - key: FITPLANNER_DB_USER
        sync: false
      - key: FITPLANNER_DB_PASSWORD
        sync: false
      - key: FITPLANNER_ALLOWED_ORIGINS
        sync: false

  - type: static
    name: fitplanner-mobile
    rootDir: apps/mobile
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
